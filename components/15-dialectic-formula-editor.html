              <!-- ویرایشگر فرمول پرومپت دیالکتیک -->
              <div class="formula-editor-card">

                    <button type="button" class="macro-chip-btn" data-macro="{{methodology_step}}"><code>{{methodology_step}}</code> <small>(نام فاز جاری)</small></button>
                    <button type="button" class="macro-chip-btn" data-macro="{{methodology_title}}"><code>{{methodology_title}}</code> <small>(نام متدولوژی)</small></button>
                    <button type="button" class="macro-chip-btn" data-macro="{{speaker_role}}"><code>{{speaker_role}}</code> <small>(نقش مدل)</small></button>
                    <button type="button" class="macro-chip-btn" data-macro="{{user_core_prompt}}"><code>{{user_core_prompt}}</code> <small>(چالش کاربر)</small></button>
                    <button type="button" class="macro-chip-btn" data-macro="{{last_speaker_name}}"><code>{{last_speaker_name}}</code> <small>(گوینده قبلی)</small></button>
                    <button type="button" class="macro-chip-btn" data-macro="{{last_speaker_argument}}"><code>{{last_speaker_argument}}</code> <small>(استدلال قبلی)</small></button>
                    <button type="button" class="macro-chip-btn" data-macro="{{round_context_brief}}"><code>{{round_context_brief}}</code> <small>(سوابق روند)</small></button>
                    <button type="button" class="macro-chip-btn" data-macro="{{consensus_agreements}}"><code>{{consensus_agreements}}</code> <small>(توافقات)</small></button>
                    <button type="button" class="macro-chip-btn" data-macro="{{consensus_gaps}}"><code>{{consensus_gaps}}</code> <small>(نقاط اختلاف)</small></button>
                    <button type="button" class="macro-chip-btn" data-macro="{{round_number}}"><code>{{round_number}}</code> <small>(شماره دور)</small></button>
                  </div>
                </div>
              </div>
            </div>

            <div class="engine-section-block">

                <span class="engine-section-badge">احکام</span>

                  <input type="number" id="sanctum-max-rounds" class="driver-text-input" min="1" max="50" value="10" />

                    <option value="verbatim">Full Verbatim (ارسال کامل متن‌ها)</option>
                  </select>
                </div>
              </div>

              <div class="driver-field-card" style="padding: 14px 16px;">
                <div class="driver-field-top" style="margin-bottom: 6px;">

                    <button type="button" id="btn-save-current-global-directive-preset" class="btn-custom-bot-link" style="font-size: 11px;">+ ذخیره به عنوان الگوی آماده</button>
                    <button type="button" id="btn-del-global-directive-preset" class="btn-custom-bot-link" style="color: #f87171; font-size: 11px; display: none;">حذف این الگو</button>
                  </div>
                </div>
                <select id="sanctum-global-directive-preset-select" class="driver-select-input" dir="rtl" style="margin-bottom: 8px;">
                  <option value="">-- الگوهای ذخیره‌شده دستورالعمل مشترک --</option>
                </select>
                <textarea id="sanctum-global-directive" class="driver-text-input sanctum-directive-editor" placeholder="دستوری که به ابتدای پرومپت همه مدل‌ها افزوده می‌شود..." dir="rtl"></textarea>
              </div>

              <button type="button" id="btn-save-protocols" class="btn-save-driver-master" style="margin-top: 6px;">
                <span>ذخیره و تثبیت کلیه تنظیمات موتور مناظره ✓</span>
              </button>

          </div>

          <div id="sanctum-zone-history" class="sanctum-zone-panel" style="display: none;">

                <p style="margin: 2px 0 0; font-size: 10px; color: #9ca3af;">ادامه جلسات قبلی، دریافت گزارشات و آرشیو کامل مذاکرات</p>
              </div>
              <button type="button" id="btn-sanctum-new-session" class="btn-load-scenario" style="width: auto; padding: 4px 12px; margin: 0; background: #262626; border-color: rgba(255,255,255,0.15); color: #ffffff;">
                <span>+ آغاز میزگرد جدید</span>
