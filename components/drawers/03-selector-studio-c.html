        <!-- Human Kinematics -->
        <div class="driver-field-card kinematics-master-card">
          <div class="driver-field-top">
            <label class="driver-field-label">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              <span>Human Kinematics & Anti-Bot Armor</span>
            </label>
            <span class="driver-field-badge active-stealth">Stealth V2</span>
          </div>
          
          <label class="toggle-row" for="driver-field-humanize-enabled" style="margin-top: 4px;">
            <div class="toggle-info">
              <span class="toggle-title">Enable Human Kinematics</span>
              <span class="toggle-sub">Simulate natural keystrokes, biologics delays, and bounding box clicks</span>
            </div>
            <input type="checkbox" id="driver-field-humanize-enabled" class="silk-switch" checked />
          </label>
        </div>

        <div class="driver-field-card" id="card-kinematics-options">
          <div class="driver-field-top">
            <label class="driver-field-label">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M6 12h.01M18 12h.01M8 16h8"/></svg>
              <span>Typing Engine Mode</span>
            </label>
            <span class="driver-field-badge">Mode</span>
          </div>
          <select id="driver-field-humanize-mode" class="driver-select-input">
            <option value="burst">Adaptive Human Burst (Natural Rhythm)</option>
            <option value="cadence">Natural Keystroke Cadence</option>
            <option value="paste">Smart Human Paste Simulation</option>
            <option value="instant">Instant Raw Dispatch</option>
          </select>

          <div class="driver-sub-grid">
            <div>
              <label class="driver-sub-label">Cadence Speed</label>
              <select id="driver-field-humanize-speed" class="driver-select-input">
                <option value="natural">Natural (75-90 WPM)</option>
                <option value="relaxed">Relaxed (45-60 WPM)</option>
                <option value="rapid">Rapid (110-130 WPM)</option>
              </select>
            </div>
            <div>
              <label class="driver-sub-label">Pre-Submit Dwell</label>
              <div class="driver-input-row">
                <input type="number" id="driver-field-presubmit-delay" class="driver-text-input" min="50" max="3000" step="50" value="500" placeholder="500" />
                <span class="unit-tag">ms</span>
              </div>
            </div>
          </div>

          <div class="driver-sub-grid">
            <div>
              <label class="driver-sub-label">Punctuation Pause</label>
              <div class="driver-input-row">
                <input type="number" id="driver-field-punctuation-delay" class="driver-text-input" min="0" max="1500" step="50" value="220" placeholder="220" />
                <span class="unit-tag">ms</span>
              </div>
            </div>
            <div>
              <label class="driver-sub-label">Click Dwell</label>
              <div class="driver-input-row">
                <input type="number" id="driver-field-click-dwell" class="driver-text-input" min="20" max="300" step="10" value="75" placeholder="75" />
                <span class="unit-tag">ms</span>
              </div>
            </div>
          </div>

          <div class="kinematics-toggles-stack">
            <label class="toggle-row" for="driver-field-cursor-jitter">
              <div class="toggle-info">
                <span class="toggle-title">Dynamic Cursor Jitter</span>
                <span class="toggle-sub">Randomize coordinates inside button bounds</span>
              </div>
              <input type="checkbox" id="driver-field-cursor-jitter" class="silk-switch" checked />
            </label>

            <label class="toggle-row" for="driver-field-hover-approach">
              <div class="toggle-info">
                <span class="toggle-title">Hover & Approach Simulation</span>
                <span class="toggle-sub">Dispatch pointerover and mousemove before clicks</span>
              </div>
              <input type="checkbox" id="driver-field-hover-approach" class="silk-switch" checked />
            </label>

            <label class="toggle-row" for="driver-field-simulate-typos">
              <div class="toggle-info">
                <span class="toggle-title">Simulate Natural Typos & Correction</span>
                <span class="toggle-sub">Occasional natural typo and backspace correction</span>
              </div>
              <input type="checkbox" id="driver-field-simulate-typos" class="silk-switch" checked />
            </label>
          </div>

          <div class="driver-test-toolbar">
            <span style="font-size: 10.5px; color: #9ca3af; font-weight: 500;">Test typing simulation:</span>
            <button type="button" id="btn-test-human-typing" class="btn-test-typing-jewel">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="M12 2l2.4 7.2L21 12l-6.6 2.8L12 22l-2.4-7.2L3 12l6.6-2.8L12 2z"/>
              </svg>
              <span>Test Typing</span>
            </button>
          </div>
          <div id="probe-status-humanTyping" class="probe-status-row"></div>
        </div>
      </form>

      <!-- Drawer Footer Controls -->
      <div class="studio-drawer-footer">
        <div class="footer-actions-grid">
          <button type="button" id="btn-export-drivers-json" class="btn-utility-ghost" title="Export Drivers to JSON">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span>Export JSON</span>
          </button>
          <button type="button" id="btn-import-drivers-json" class="btn-utility-ghost" title="Import Drivers from JSON">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span>Import JSON</span>
          </button>
          <input type="file" id="file-import-drivers" accept=".json" style="display: none;" />
          <button type="button" id="btn-reset-factory-drivers" class="btn-utility-ghost" style="color: #f87171;" title="Restore Default Selectors">
            <span>Reset Factory</span>
          </button>
        </div>

        <button type="button" id="btn-save-driver-master" class="btn-save-driver-master">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          <span>Save Driver Profile</span>
        </button>
      </div>
    </aside>
