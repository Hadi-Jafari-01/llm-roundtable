<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f121d" />
      <stop offset="100%" stop-color="#090a10" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#818cf8" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#1e2436" stroke-width="2" />

  <!-- Multi-window split screen icon with AI lightning spark -->
  <g filter="url(#neon)">
    <!-- Split windows outline -->
    <rect x="22" y="24" width="38" height="38" rx="8" fill="none" stroke="url(#glowGrad)" stroke-width="3" opacity="0.9" />
    <rect x="68" y="24" width="38" height="38" rx="8" fill="none" stroke="url(#glowGrad)" stroke-width="3" opacity="0.9" />
    <rect x="22" y="70" width="38" height="38" rx="8" fill="none" stroke="url(#glowGrad)" stroke-width="3" opacity="0.9" />
    <rect x="68" y="70" width="38" height="38" rx="8" fill="none" stroke="url(#glowGrad)" stroke-width="3" opacity="0.9" />

    <!-- Center Neural Spark -->
    <polygon points="64,36 68,58 84,64 68,70 64,92 60,70 44,64 60,58" fill="url(#glowGrad)" />
  </g>
</svg>
